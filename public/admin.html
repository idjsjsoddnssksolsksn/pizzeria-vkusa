<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17130f"><title>VKUSA Admin</title><link rel="stylesheet" href="admin.css"></head><body>
<div id="loginScreen" class="login-screen"><form id="adminLogin" class="login-card"><div class="admin-mark">V</div><span>VKUSA CONTROL</span><h1>Админ-панель</h1><p>Заказы, статусы и меню — без GitHub.</p><input id="adminUser" autocomplete="username" placeholder="Логин"><input id="adminPass" type="password" autocomplete="current-password" placeholder="Пароль"><button>Войти</button><div id="loginMsg"></div></form></div>
<div id="adminApp" hidden><aside><div class="side-brand"><b>V</b><div><strong>VKUSA</strong><small>CONTROL PANEL</small></div></div><button class="nav active" data-page="orders">Заказы</button><button class="nav" data-page="menu">Редактор меню</button><button class="nav" data-page="settings">Настройки кафе</button><button id="refreshBtn" class="nav">Обновить</button><button id="adminLogout" class="nav danger">Выйти</button></aside>
<main><header><div><small>УПРАВЛЕНИЕ КАФЕ</small><h1 id="pageTitle">Заказы</h1></div><div id="summary" class="summary"></div></header><section id="ordersPage" class="page active"><div id="ordersList" class="orders-list"></div></section><section id="menuPage" class="page"><div class="toolbar"><input id="menuSearch" placeholder="Поиск блюда"><button id="newProduct">+ Новое блюдо</button></div><div id="productsList" class="products-list"></div></section><section id="settingsPage" class="page"><div class="settings-card"><h2>Настройки кафе</h2><form id="settingsForm"><label>Название<input id="sName" required></label><label>Телефон<input id="sPhone"></label><label>Адрес<input id="sAddress"></label><label>Часы работы<input id="sHours" placeholder="Ежедневно 10:00–23:00"></label><div class="two"><label>Мин. заказ, ₽<input id="sMin" type="number" min="0"></label><label>Доставка, ₽<input id="sDelivery" type="number" min="0"></label></div><label>Бесплатная доставка от, ₽<input id="sFree" type="number" min="0"></label><button class="primary">Сохранить настройки</button><div id="settingsMsg"></div></form></div></section></main></div>
<dialog id="productDialog"><form id="productForm"><h2 id="productDialogTitle">Блюдо</h2><input id="pId" type="hidden"><label>Название<input id="pName" required></label><label>Категория<input id="pCategory" required></label><label>Описание<textarea id="pDescription" rows="3"></textarea></label><div class="two"><label>Цена, ₽<input id="pPrice" type="number" min="0" required></label><label>Порядок<input id="pSort" type="number" value="0"></label></div><label>Ссылка на фото<input id="pImage" placeholder="https://..."></label><label class="check"><input id="pActive" type="checkbox" checked> Показывать на сайте</label><div class="dialog-actions"><button type="button" id="cancelProduct">Отмена</button><button class="primary" type="submit">Сохранить</button></div></form></dialog>
<script src="admin.js"></script></body></html>
